<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Webhook Relay works</title>
  <desc id="d">Paystack, Stripe or Flutterwave send a webhook to the relay. The relay checks the signature, drops duplicates and stores the event, replying 200 at once. A worker delivers it to your app, signed by the relay, and retries with backoff until your app answers 2xx. After too many failures the event is marked dead and can be replayed.</desc>
  <rect width="1100" height="320" fill="#0e0d0b"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a09a89"/></marker></defs>
  <g fill="#16150f" stroke="#3d392e" stroke-width="1.5">
    <rect x="25" y="110" width="180" height="100" rx="4"/>
    <rect x="265" y="90" width="230" height="140" rx="4"/>
    <rect x="555" y="110" width="200" height="100" rx="4"/>
    <rect x="820" y="50" width="255" height="90" rx="4" stroke="#3fb27f"/>
    <rect x="820" y="185" width="255" height="90" rx="4" stroke="#e0614c"/>
  </g>
  <g fill="#f3f0e6" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="115" y="150">Provider</text>
    <text x="380" y="122">Relay: /in/{source}</text>
    <text x="655" y="150">Delivery worker</text>
    <text x="947" y="88" fill="#3fb27f">Your app (2xx)</text>
    <text x="947" y="223" fill="#e0614c">Dead after N tries</text>
  </g>
  <g fill="#a09a89" font-size="13" text-anchor="middle">
    <text x="115" y="175">Paystack · Stripe</text>
    <text x="115" y="193">Flutterwave · any</text>
    <text x="380" y="150">1. check signature</text>
    <text x="380" y="170">2. drop duplicates</text>
    <text x="380" y="190">3. store, reply 200 at once</text>
    <text x="380" y="210" fill="#6d6858">SQLite or Postgres</text>
    <text x="655" y="175">signs with X-Relay-Signature</text>
    <text x="655" y="193">retries 10s, 30s, 2m, 10m…</text>
    <text x="947" y="112">delivered, with full history</text>
    <text x="947" y="247">shown on the dashboard</text>
    <text x="947" y="265">replay with one click</text>
  </g>
  <g stroke="#a09a89" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M205 160 H260"/>
    <path d="M495 160 H550"/>
    <path d="M755 150 C790 150 790 95 815 95"/>
    <path d="M755 170 C790 170 790 230 815 230"/>
    <path d="M655 210 C655 260 720 270 720 240" stroke-dasharray="4 4"/>
  </g>
  <text x="700" y="295" fill="#6d6858" font-size="12" text-anchor="middle">failed? wait, then try again</text>
</svg>
