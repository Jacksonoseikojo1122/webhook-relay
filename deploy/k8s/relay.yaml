# Runs two relays sharing one Postgres. Claiming uses FOR UPDATE SKIP LOCKED,
# so the replicas split the work without delivering any event twice.
#   kubectl create secret generic webhook-relay \
#     --from-literal=DATABASE_URL=postgres://... --from-literal=RELAY_ADMIN_TOKEN=... \
#     --from-file=relay.json=./relay.json
#   kubectl apply -f deploy/k8s/relay.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-relay
  labels: { app: webhook-relay }
spec:
  replicas: 2
  selector:
    matchLabels: { app: webhook-relay }
  template:
    metadata:
      labels: { app: webhook-relay }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: relay
          image: ghcr.io/jacksonoseikojo1122/webhook-relay:v0.1.0
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: RELAY_CONFIG, value: /config/relay.json }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: webhook-relay, key: DATABASE_URL } }
            - name: RELAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: webhook-relay, key: RELAY_ADMIN_TOKEN } }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          secret:
            secretName: webhook-relay
            items: [{ key: relay.json, path: relay.json }]
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-relay
spec:
  selector: { app: webhook-relay }
  ports: [{ port: 80, targetPort: http, name: http }]
