# Push a tag like v0.1.0 to publish the container image to GitHub Packages.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/jacksonoseikojo1122/webhook-relay:${{ github.ref_name }}
            ghcr.io/jacksonoseikojo1122/webhook-relay:latest
