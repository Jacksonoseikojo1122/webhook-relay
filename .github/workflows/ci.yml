name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests on SQLite, with the race detector
        run: go test -race ./...
      - name: Store tests on Postgres
        run: go test ./internal/store
        env:
          TEST_DATABASE_URL: postgres://postgres:relay@localhost:5432/postgres?sslmode=disable
      - run: docker build -t webhook-relay .
